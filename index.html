<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAYRUN</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:ital,wght@1,500;1,700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        logo: ['Playfair Display', 'Cinzel', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#0e0e10',
                        cardBg: '#18181c',
                        inputBg: '#1c1c22',
                        accentPink: '#f3a4b5',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0d0e12;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .dayrun-logo {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            letter-spacing: 0.15em;
            font-weight: 700;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #111216;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2d38;
            border-radius: 3px;
        }

        .chapter-item {
            transition: all 0.2s ease;
        }
        .chapter-item:hover {
            color: #ffffff;
            transform: translateX(4px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.35s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start pb-16">

    <!-- Main Outer Container -->
    <div class="w-full max-w-md min-h-screen px-4 pt-8 flex flex-col gap-6 relative">

        <!-- LOGO HEADER & ADMIN LOCK BUTTON -->
        <header class="text-left pt-2 pb-1 flex items-center justify-between">
            <h1 class="dayrun-logo text-3xl tracking-widest text-white italic drop-shadow-md">DAYRUN</h1>
            <button onclick="openLoginModal()" class="w-9 h-9 rounded-full bg-[#18181c] border border-gray-800 flex items-center justify-center text-gray-400 hover:text-white transition-colors">
                <i class="fa-solid fa-lock text-xs"></i>
            </button>
        </header>

        <!-- HERO BANNER CARD -->
        <div onclick="openHeroCard()" 
             class="relative w-full h-44 rounded-2xl overflow-hidden cursor-pointer shadow-2xl group transition-all duration-300 hover:brightness-110">
            <img src="yaraticiyamektuplar.png" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-[#0e0e12] via-transparent to-transparent opacity-90"></div>
            <div class="absolute bottom-3 left-4 right-4 flex items-center justify-between">
                <span class="text-white text-lg font-medium tracking-wide drop-shadow-md">
                    Yaratıcı'ya Mektuplar
                </span>
                <i class="fa-solid fa-chevron-right text-xs text-gray-400 group-hover:translate-x-1 transition-transform"></i>
            </div>
        </div>

        <!-- GÜNCELLER -->
        <section class="flex flex-col gap-2 mt-2">
            <h2 class="text-xs font-bold tracking-widest text-gray-300 uppercase px-1">GÜNCELLER</h2>
            
            <div class="flex items-center gap-5 bg-transparent p-1">
                <div class="w-36 h-24 rounded-2xl overflow-hidden shrink-0 relative bg-pink-200 shadow-lg group cursor-pointer"
                     onclick="openFirstItem('GÜNCELLER')">
                    <img src="guncelleri.jpg" class="w-full h-full object-cover">
                </div>

                <div id="list-GÜNCELLER" class="flex flex-col gap-2.5 text-sm text-gray-300 font-normal">
                    <!-- Dinamik yüklenecek -->
                </div>
            </div>
        </section>

        <!-- BELLEK KAPSÜLÜ -->
        <section class="flex flex-col gap-2 mt-2">
            <h2 class="text-xs font-bold tracking-widest text-gray-300 uppercase px-1">BELLEK KAPSÜLÜ</h2>
            
            <div class="flex items-center gap-5 bg-transparent p-1">
                <div class="w-36 h-24 rounded-2xl overflow-hidden shrink-0 relative bg-slate-800 shadow-lg group cursor-pointer"
                     onclick="openFirstItem('BELLEK KAPSÜLÜ')">
                    <img src="bellekkapsulu.png" class="w-full h-full object-cover">
                </div>

                <div id="list-BELLEK KAPSÜLÜ" class="flex flex-col gap-2.5 text-sm text-gray-300 font-normal">
                    <!-- Dinamik yüklenecek -->
                </div>
            </div>
        </section>

        <!-- ZORUNLU DOKUNUŞ -->
        <section class="flex flex-col gap-2 mt-2">
            <h2 class="text-xs font-bold tracking-widest text-gray-300 uppercase px-1">ZORUNLU DOKUNUŞ</h2>
            
            <div class="flex items-center gap-5 bg-transparent p-1">
                <div class="w-36 h-24 rounded-2xl overflow-hidden shrink-0 relative bg-amber-100 shadow-lg group cursor-pointer"
                     onclick="openFirstItem('ZORUNLU DOKUNUŞ')">
                    <img src="birhikaye.png" class="w-full h-full object-cover">
                </div>

                <div id="list-ZORUNLU DOKUNUŞ" class="flex flex-col gap-2.5 text-sm text-gray-300 font-normal">
                    <!-- Dinamik yüklenecek -->
                </div>
            </div>
        </section>

        <!-- NEDEN MÜSLÜMANIM -->
        <section class="flex flex-col gap-2 mt-2">
            <h2 class="text-xs font-bold tracking-widest text-gray-300 uppercase px-1">NEDEN MÜSLÜMANIM</h2>
            
            <div class="flex items-center gap-5 bg-transparent p-1">
                <div class="w-36 h-24 rounded-2xl overflow-hidden shrink-0 relative bg-indigo-900 shadow-lg group cursor-pointer"
                     onclick="openFirstItem('NEDEN MÜSLÜMANIM')">
                    <img src="nedenmuslumanim.png" class="w-full h-full object-cover">
                </div>

                <div id="list-NEDEN MÜSLÜMANIM" class="flex flex-col gap-2.5 text-sm text-gray-300 font-normal">
                    <!-- Dinamik yüklenecek -->
                </div>
            </div>
        </section>

        <!-- FOOTER -->
        <footer class="mt-8 mb-4 text-center text-xs text-gray-600 font-light">
            &copy; 2026 DAYRUN. Tüm Hakları Saklıdır.
        </footer>
    </div>

    <!-- 1. LOGIN MODAL -->
    <div id="loginModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#14151b] border border-gray-800 w-full max-w-xs rounded-3xl p-6 shadow-2xl flex flex-col gap-4 animate-fade-in relative">
            <div class="flex items-center justify-between">
                <h3 class="text-white font-bold text-sm tracking-wider">Yönetici Girişi</h3>
                <button onclick="closeLoginModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-xs text-gray-400">Yeni mektup/yazı eklemek için şifreni gir.</p>
            <input type="password" id="adminPassword" placeholder="Şifre..." class="w-full bg-[#1c1c22] border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-pink-500/50" onkeypress="handlePasswordKey(event)">
            <button onclick="checkPassword()" class="w-full bg-white text-black font-semibold rounded-xl py-2.5 text-xs tracking-wider uppercase hover:bg-gray-200 transition-colors">Giriş Yap</button>
        </div>
    </div>

    <!-- 2. ADMIN PANEL MODAL -->
    <div id="adminPanelModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#14151b] border border-gray-800 w-full max-w-md h-[85vh] rounded-3xl p-6 shadow-2xl flex flex-col justify-between animate-fade-in relative overflow-hidden">
            <div class="flex items-center justify-between border-b border-gray-800 pb-4 shrink-0">
                <h3 class="text-white font-bold text-sm tracking-wider"><i class="fa-solid fa-pen-nib mr-2 text-pink-400"></i> Yeni İçerik Ekle</h3>
                <button onclick="closeAdminPanel()" class="w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center text-gray-300 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="flex-1 overflow-y-auto py-4 flex flex-col gap-4 text-xs">
                <div class="flex flex-col gap-1.5">
                    <label class="text-gray-400 font-medium">Kategori Seç</label>
                    <select id="newCategory" class="w-full bg-[#1c1c22] border border-gray-800 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-pink-500/50">
                        <option value="Yaratıcı'ya Mektuplar">Yaratıcı'ya Mektuplar</option>
                        <option value="GÜNCELLER">GÜNCELLER</option>
                        <option value="BELLEK KAPSÜLÜ">BELLEK KAPSÜLÜ</option>
                        <option value="ZORUNLU DOKUNUŞ">ZORUNLU DOKUNUŞ</option>
                        <option value="NEDEN MÜSLÜMANIM">NEDEN MÜSLÜMANIM</option>
                    </select>
                </div>

                <div class="flex flex-col gap-1.5">
                    <label class="text-gray-400 font-medium">Başlık / Bölüm Adı</label>
                    <input type="text" id="newTitle" placeholder="Örn: Mektup 2 veya Bölüm 4" class="w-full bg-[#1c1c22] border border-gray-800 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-pink-500/50">
                </div>

                <div class="flex flex-col gap-1.5 flex-1">
                    <label class="text-gray-400 font-medium">Yazı / Mektup İçeriği</label>
                    <textarea id="newContent" placeholder="Buraya yazını veya mektubunu yaz..." class="w-full flex-1 bg-[#1c1c22] border border-gray-800 rounded-xl p-3 text-white focus:outline-none focus:border-pink-500/50 resize-none h-40"></textarea>
                </div>
            </div>

            <div class="pt-3 border-t border-gray-800 shrink-0">
                <button onclick="saveNewContent()" class="w-full bg-pink-400 text-black font-semibold rounded-xl py-3 text-xs tracking-wider uppercase hover:bg-pink-300 transition-colors">Yayınla</button>
            </div>
        </div>
    </div>

    <!-- 3. READER MODAL -->
    <div id="readerModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#14151b] border border-gray-800 w-full max-w-md h-[88vh] rounded-3xl p-6 shadow-2xl flex flex-col justify-between animate-fade-in relative overflow-hidden">
            
            <div class="flex items-center justify-between border-b border-gray-800 pb-4 shrink-0">
                <div>
                    <span id="modalCategory" class="text-xs font-semibold text-pink-400 uppercase tracking-wider block">GÜNCELLER</span>
                    <h3 id="modalTitle" class="text-lg font-bold text-white tracking-wide">Güncel 1</h3>
                </div>
                <button onclick="closeReaderModal()" class="w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center text-gray-300 hover:text-white">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto py-6 pr-1 flex flex-col gap-4 text-gray-300 text-sm leading-relaxed" id="readerBody">
                <p class="text-gray-400 italic">İçerik yükleniyor...</p>
            </div>

            <div class="pt-3 border-t border-gray-800 flex items-center justify-between shrink-0 text-xs text-gray-400">
                <button onclick="toast('Önceki bölüm bulunmuyor')" class="hover:text-white px-3 py-2 rounded-lg bg-gray-900 border border-gray-800">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Önceki
                </button>
                <span>DAYRUN Reader</span>
                <button onclick="toast('Sonraki bölüme geçildi')" class="hover:text-white px-3 py-2 rounded-lg bg-gray-900 border border-gray-800">
                    Sonraki <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50 pointer-events-none"></div>

    <script>
        // Kesin Yönetici Şifresi
        const ADMIN_PASSWORD = "Day1221"; 

        let dbContent = JSON.parse(localStorage.getItem('dayrun_db')) || {
            "GÜNCELLER": [
                { title: "Güncel 1", body: "Güncel Serisi - Bölüm 1 içeriği burada yer alıyor." },
                { title: "Güncel 2", body: "Güncel Serisi - Bölüm 2 içeriği burada yer alıyor." },
                { title: "Güncel 3", body: "Güncel Serisi - Bölüm 3 içeriği burada yer alıyor." }
            ],
            "BELLEK KAPSÜLÜ": [
                { title: "Kapsül 1", body: "Zamanın ötesinden gelen ilk mesaj." },
                { title: "Kapsül 2", body: "Unutulmayan hatıraların kaydı." },
                { title: "Kapsül 3", body: "Geleceğe bırakılan notlar." }
            ],
            "ZORUNLU DOKUNUŞ": [
                { title: "Bölüm 1", body: "Zorunlu Dokunuş - 1. Bölüm." },
                { title: "Bölüm 2", body: "Zorunlu Dokunuş - 2. Bölüm." },
                { title: "Bölüm 3", body: "Zorunlu Dokunuş - 3. Bölüm." }
            ],
            "NEDEN MÜSLÜMANIM": [
                { title: "Varan 1", body: "Neden Müslümanım? - Varan 1 detaylı anlatımı." },
                { title: "Varan 2", body: "Neden Müslümanım? - Varan 2 detaylı anlatımı." },
                { title: "Varan 3", body: "Neden Müslümanım? - Varan 3 detaylı anlatımı." }
            ],
            "Yaratıcı'ya Mektuplar": [
                { title: "Özel Mektup 1", body: "Gökyüzünün her tonunda seni aramak..." }
            ]
        };

        function renderLists() {
            for (let cat in dbContent) {
                let container = document.getElementById('list-' + cat);
                if (container) {
                    container.innerHTML = '';
                    dbContent[cat].forEach(item => {
                        let btn = document.createElement('button');
                        btn.className = 'chapter-item text-left hover:text-white';
                        btn.innerText = item.title;
                        btn.onclick = () => openReader(cat, item.title, item.body);
                        container.appendChild(btn);
                    });
                }
            }
        }

        function openLoginModal() {
            document.getElementById('adminPassword').value = '';
            document.getElementById('loginModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('adminPassword').focus(), 100);
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
        }

        function handlePasswordKey(event) {
            if (event.key === 'Enter') {
                checkPassword();
            }
        }

        function checkPassword() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === ADMIN_PASSWORD) {
                closeLoginModal();
                document.getElementById('adminPanelModal').classList.remove('hidden');
            } else {
                toast("Yanlış şifre! (Day1221)");
            }
        }

        function closeAdminPanel() {
            document.getElementById('adminPanelModal').classList.add('hidden');
        }

        function saveNewContent() {
            const category = document.getElementById('newCategory').value;
            const title = document.getElementById('newTitle').value;
            const content = document.getElementById('newContent').value;

            if(!title || !content) {
                toast("Lütfen başlık ve içerik doldur.");
                return;
            }

            if(!dbContent[category]) {
                dbContent[category] = [];
            }

            dbContent[category].push({ title: title, body: content });
            localStorage.setItem('dayrun_db', JSON.stringify(dbContent));

            renderLists();
            toast("İçerik başarıyla eklendi ve kaydedildi!");
            closeAdminPanel();
            
            document.getElementById('newTitle').value = '';
            document.getElementById('newContent').value = '';
        }

        function openHeroCard() {
            const mektuplar = dbContent["Yaratıcı'ya Mektuplar"];
            if (mektuplar && mektuplar.length > 0) {
                openReader("Yaratıcı'ya Mektuplar", mektuplar[0].title, mektuplar[0].body);
            } else {
                openReader("Yaratıcı'ya Mektuplar", "Özel Mektup", "Henüz mektup eklenmemiş.");
            }
        }

        function openFirstItem(category) {
            const items = dbContent[category];
            if (items && items.length > 1) {
                openReader(category, items[1].title, items[1].body);
            } else if (items && items.length > 0) {
                openReader(category, items[0].title, items[0].body);
            }
        }

        function openReader(category, title, summary) {
            document.getElementById('modalCategory').innerText = category;
            document.getElementById('modalTitle').innerText = title;

            let contentHTML = `
                <div class="p-4 bg-[#1a1c24] rounded-2xl border border-gray-800 flex flex-col gap-3">
                    <h4 class="text-white font-semibold text-base">${title}</h4>
                    <p class="text-gray-300 text-xs leading-relaxed whitespace-pre-line">${summary}</p>
                </div>
            `;

            document.getElementById('readerBody').innerHTML = contentHTML;
            document.getElementById('readerModal').classList.remove('hidden');
        }

        function closeReaderModal() {
            document.getElementById('readerModal').classList.add('hidden');
        }

        function toast(msg) {
            const container = document.getElementById('toastContainer');
            const toastEl = document.createElement('div');
            toastEl.className = 'bg-gray-800/90 text-white text-xs px-4 py-2.5 rounded-full border border-gray-700 shadow-xl backdrop-blur-md animate-fade-in my-1 text-center';
            toastEl.innerText = msg;
            
            container.appendChild(toastEl);

            setTimeout(() => {
                toastEl.style.opacity = '0';
                toastEl.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toastEl.remove(), 300);
            }, 2500);
        }

        window.onload = function() {
            renderLists();
        };
    </script>
</body>
</html>
