backend:
  name: git-gateway
  branch: main # ya da master hangi kolu kullanıyorsan

media_folder: "images"
public_folder: "/images"

collections:
  - name: "icerikler"
    label: "İçerikler"
    folder: "content"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Başlık", name: "title", widget: "string" }
      - { 
          label: "Tür", 
          name: "tur", 
          widget: "select", 
          options: ["Mektup", "Kapsül", "Zarf"] 
        }
      - { label: "İçerik", name: "body", widget: "markdown" }
